# Teleport resources as code (teleport-resources/ in this repo: roles, join
# tokens, bots, workload identities, SAML apps, Managed Updates), reconciled
# by the operator in the teleport-cluster chart (operator.enabled), which
# only watches the release namespace.
#
# The chart's operator role allows nearly every Teleport kind; this
# AppProject limits that path to the kinds below, in that namespace, nothing
# cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: teleport-resources
  namespace: argocd
spec:
  description: Teleport resources (teleport-resources/)
  sourceRepos:
    - {{ .Values.teleportResources.repoURL | quote }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: teleport-cluster
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    {{- range list "TeleportRoleV8" "TeleportProvisionToken" "TeleportBotV1" "TeleportWorkloadIdentityV1" "TeleportSAMLIdPServiceProviderV1" "TeleportAutoupdateConfigV1" "TeleportAutoupdateVersionV1" }}
    - group: resources.teleport.dev
      kind: {{ . }}
    {{- end }}
---
# Prune on: removing a file deletes the resource in Teleport.
# No resources-finalizer: deleting this Application leaves the resources (and
# Teleport) alone.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teleport-resources
  namespace: argocd
spec:
  project: teleport-resources
  source:
    repoURL: {{ .Values.teleportResources.repoURL | quote }}
    # The branch the root Application follows (bootstrap/install-argocd.sh)
    targetRevision: {{ required "revision (re-run bootstrap/install-argocd.sh)" .Values.revision | quote }}
    path: {{ .Values.teleportResources.path | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: teleport-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
