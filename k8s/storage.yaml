apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: teleport-ebs
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
parameters:
  type: gp3
  encrypted: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleport-storage
  namespace: teleport
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: teleport-ebs
  resources:
    requests:
      storage: 10Gi
